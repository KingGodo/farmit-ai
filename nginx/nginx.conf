events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 80;
        listen [::]:80;
        server_name farmitai.co.zw www.farmitai.co.zw admin.farmitai.co.zw api.farmitai.co.zw;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name farmitai.co.zw www.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://website:3000;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name admin.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://dashboard:3000;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend:8080;
        }
    }
}
