events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    client_max_body_size 20m;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream website_upstream {
        server website:3000;
        keepalive 16;
    }

    upstream dashboard_upstream {
        server dashboard:3000;
        keepalive 16;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 8;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering on;

    server {
        listen 80;
        listen [::]:80;
        server_name farmitai.co.zw www.farmitai.co.zw admin.farmitai.co.zw api.farmitai.co.zw;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name farmitai.co.zw www.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /_next/static/ {
            proxy_pass http://website_upstream;
            proxy_hide_header Cache-Control;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /images/ {
            proxy_pass http://website_upstream;
            proxy_hide_header Cache-Control;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location / {
            proxy_pass http://website_upstream;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name admin.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /_next/static/ {
            proxy_pass http://dashboard_upstream;
            proxy_hide_header Cache-Control;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /images/ {
            proxy_pass http://dashboard_upstream;
            proxy_hide_header Cache-Control;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location / {
            proxy_pass http://dashboard_upstream;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.farmitai.co.zw;

        ssl_certificate     /etc/letsencrypt/live/farmitai.co.zw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/farmitai.co.zw/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_upstream;
        }
    }
}
