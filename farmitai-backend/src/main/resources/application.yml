spring:
  application:
    name: farmitai-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:farmitai-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

farmit:
  jwt:
    secret: ${FARMIT_JWT_SECRET:local-dev-only-change-me-32chars-min}
    access-ttl: 15m
    refresh-ttl: 30d
  otp:
    ttl: 5m
    log-code: ${FARMIT_OTP_LOG_CODE:true}
    max-attempts: 5
  admin:
    email: ${FARMIT_ADMIN_EMAIL:admin@farmit.co.zw}
    password: ${FARMIT_ADMIN_PASSWORD:changeme}
    phone: ${FARMIT_ADMIN_PHONE:+263700000000}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:farmit-dev-verify}
    app-secret: ${WHATSAPP_APP_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
